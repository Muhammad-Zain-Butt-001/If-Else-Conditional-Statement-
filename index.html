<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF-ELSE CONDITION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- container---1 -->
    <div class="container-1">
        <!-- voting -->
        <div class="voting">
            <div class="voting-header">
                <h1>Age Checker</h1>
            </div>
            <div class="voting-body">
                <label class="voting-subtittle" for="age">Enter your age to check your eligibility.</label>
                <input  type="number" id="age" name="age" placeholder="Enter your age">
                <button class="voting-button" onclick="checkEligibility()">Check Eligibility</button>
                <p id="result"></p>
            </div>
        </div>
        <!-- even odd -->
        <div class="even-odd">
            <div class="even-odd-heading">
                <h1>Even or Odd Checker</h1>
            </div>
            <div class="even-odd-body">
                <label class="even-odd-subtittle" for="number">Enter a number to check if it's even or odd.</label>
                <input type="number" id="number" name="number" placeholder="Enter a number">
                <button class="even-odd-button" onclick="checkEvenOdd()">Check Even/Odd</button>
                <p id="evenOddResult"></p>
            </div>
        </div>
    </div>
    
 <!-- container---2 -->
<div class="container-2">
    <!-- positve negative number checking -->
    <div class="pos-neg">
        <div class="pos-neg-heading">
            <h1> Number Checker</h1>
        </div>
        <div class="pos-neg-body">
            <label class="pos-neg-subtitle" for="num">Enter a number for checking the number is positive , negative & zero.</label>
            <input type="number" id="num" name="num">
            <button class="pos-neg-button" onclick="numberChecking()"> Check Number</button>
            <p  id="pos-neg-result"></p>
        </div>

    </div>
    <!-- grade calculate system -->
    <div class="grade-calculate">
        <div class="grade-calculate-heading">
            <h1>Grade Calculator</h1>
        </div>
        <div class="grade-calculate-body">
            <label class="grade-calculate-subtitle" for="score">Enter your score to calculate the grade.</label>
            <input type="number" id="score" name="score" placeholder="Enter your score">
            <button class="grade-calculate-button" onclick="calculateGrade()">Calculate Grade</button>
            <p id="gradeResult"></p>
        </div>
    </div>
</div>
 <!-- container---3 -->
<div class="container-3">
    <!-- leap year -->  
    <div class="leap-year">
        <div class="leap-year-heading">
            <h1>Leap Year Checker</h1>
        </div>
        <div class="leap-year-body">
            <label class="leap-year-subtitle" for="year">Enter a year to check if it's a leap year.</label>
            <input type="number" id="year" name="year" placeholder="Enter a year">
            <button class="leap-year-button" onclick="checkLeapYear()">Check Leap Year</button>
            <p id="leapYearResult"></p>
        </div>
    </div>
    <!-- fail passing system -->
    <div class="fail-passing">
        <div class="fail-passing-heading">
            <h1>Fail or Pass Checker</h1>
        </div>
        <div class="fail-passing-body">
            <label class="fail-passing-subtitle" for="marks">Enter your marks to check if you passed or failed.</label>
            <input type="number" id="marks" name="marks" placeholder="Enter your marks">
            <button class="fail-passing-button" onclick="checkFailPass()">Check Result</button>
            <p id="failPassResult"></p>
        </div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
